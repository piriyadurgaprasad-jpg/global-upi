<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Complete Profile</title>

<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #6a11cb, #2575fc);
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .card {
        background: #fff;
        padding: 30px;
        width: 350px;
        border-radius: 15px;
        box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        animation: fadeIn 0.6s ease-in-out;
    }

    h2 {
        text-align: center;
        margin-bottom: 20px;
        color: #333;
    }

    input, select {
        width: 100%;
        padding: 10px;
        margin: 10px 0;
        border: 1px solid #ddd;
        border-radius: 8px;
        outline: none;
        transition: 0.3s;
    }

    input:focus, select:focus {
        border-color: #2575fc;
        box-shadow: 0 0 5px rgba(37,117,252,0.5);
    }

    button {
        width: 100%;
        padding: 12px;
        background: #2575fc;
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        cursor: pointer;
        transition: 0.3s;
    }

    button:hover {
        background: #1a5edb;
    }

    .hint {
        font-size: 12px;
        color: gray;
        text-align: center;
        margin-top: 5px;
    }

    @keyframes fadeIn {
        from {opacity: 0; transform: translateY(20px);}
        to {opacity: 1; transform: translateY(0);}
    }
</style>
</head>

<body>

<div class="card">
    <h2>Complete Profile</h2>

    <form method="POST">
        {% csrf_token %}

        <input type="text" name="mobile" placeholder="Enter Mobile" required>

        <!-- Currency Dropdown -->
        <select name="currency" required>
            <option value="">Select Currency</option>
            <option value="INR">INR (₹)</option>
            <option value="USD">USD ($)</option>
            <option value="GBP">GBP (£)</option>
        </select>

        <!-- Password -->
        <input type="password" name="password" placeholder="Set Password (optional)">
        <input type="password" name="confirm_password" placeholder="Confirm Password">

        <button type="submit">Complete Profile</button>
        <div class="hint">Secure your account with a password</div>
    </form>
</div>

</body>
</html>
